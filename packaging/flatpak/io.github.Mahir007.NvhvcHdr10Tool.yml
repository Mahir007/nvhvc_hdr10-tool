# Build and install locally, from the repo root:
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/io.github.Mahir007.NvhvcHdr10Tool.yml
#   flatpak run io.github.Mahir007.NvhvcHdr10Tool gui
#   flatpak run io.github.Mahir007.NvhvcHdr10Tool tools
#
# The sandbox can't run the host's media tools, so ffmpeg, MKVToolNix and GPAC are built here.
# MKVToolNix needs Qt Core, Boost and GMP, which the GNOME SDK doesn't have.
id: io.github.Mahir007.NvhvcHdr10Tool
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nvhvc
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The tools read the encode by its path, and the output goes next to it, so the app needs the
  # folders themselves rather than the single files the file chooser portal hands out.
  - --filesystem=host
  # The work folder holds a copy of the encode. The sandbox's /tmp is in memory, /var/tmp is on
  # disk.
  - --env=TMPDIR=/var/tmp
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: gmp
    build-options:
      # GMP 6.3.0's configure tests are older C than the SDK's GCC accepts by default.
      cflags: -std=gnu17
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
        sha256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=filesystem,system
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS link=shared variant=release install
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
        sha256: 1bed88e40401b2cb7a1f76d4bab499e352fa4d0c5f31c0dbae64e24d34d7513b

  # Qt Core and qmake only: MKVToolNix's command-line tools need nothing else from Qt.
  - name: qtbase
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_BUILD_EXAMPLES=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DFEATURE_gui=OFF
      - -DFEATURE_widgets=OFF
      - -DFEATURE_dbus=OFF
      - -DFEATURE_network=OFF
      - -DFEATURE_sql=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_concurrent=OFF
      - -DFEATURE_xml=OFF
    cleanup:
      - /bin
      - /libexec
      - /mkspecs
      - /metatypes
      - /modules
      - /sbom
      - '*.prl'
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtbase-everywhere-src-6.11.3.tar.xz
        sha256: 46de0710b594945a5d446ae44354daa386141c6903c53781b2ca547bc62f8f8f

  - name: mkvtoolnix
    buildsystem: simple
    build-commands:
      # configure checks the SDK's DocBook stylesheets, though the man pages aren't built here.
      - ./configure --prefix=/app --with-boost=/app --with-qmake6=/app/bin/qmake --disable-gui
        --disable-update-check --with-docbook-xsl-root=/usr/share/xml/docbook/xml/xsl-stylesheets
      - ./drake -j $FLATPAK_BUILDER_N_JOBS apps:mkvmerge apps:mkvextract
      - install -Dm755 -t /app/bin src/mkvmerge src/mkvextract
    sources:
      - type: archive
        url: https://mkvtoolnix.download/sources/mkvtoolnix-104.0.tar.xz
        sha256: 8f07b39d6cea1aad029f253e0e6e6a54c0e0f3ba91bfc3b2157915630d48a62b

  # Shared, so GPAC uses these libraries for its Matroska import rather than the runtime's.
  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-ffplay
      - --disable-debug
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: gpac
    config-opts:
      - --disable-x11
    cleanup:
      - /bin/gpac
    sources:
      - type: archive
        url: https://github.com/gpac/gpac/archive/refs/tags/v26.07.0.tar.gz
        sha256: 57822c1a74dcb83d76ff1f671e1b4fae2e7614e8194a5adb9f20661e0e9421dd
      # FFmpeg 9 removed AVCodec's capability arrays (gpac/gpac#3850). Arch and Homebrew build
      # GPAC 26.07 with this patch.
      - type: file
        url: https://gitlab.archlinux.org/archlinux/packaging/packages/gpac/-/raw/270a935296832d1daba2e459354a654e60f0fa68/ffmpeg-9.patch
        sha256: d1867a638ac3dd83df1c11e46467b96cec13b757317af1bbb9003da926fd8fc7
      - type: shell
        commands:
          - patch -p1 < ffmpeg-9.patch

  - name: nvhvc
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/nvhvc/cargo
        # CI replaces these with the version it builds, that version's Cargo profile, and the
        # profile's folder in target.
        NVHVC_VERSION: 0.0.0-dev
        NVHVC_PROFILE: dev
        NVHVC_PROFILE_DIR: debug
      # cargo downloads the crates in Cargo.lock.
      build-args:
        - --share=network
      # A fast build keeps its debug info in the binaries, since the bundle leaves out the debug
      # extension. A release build is stripped by cargo already.
      no-debuginfo: true
    build-commands:
      - cargo build --profile "$NVHVC_PROFILE" --locked -p nvhvc
      - install -Dm755 -t /app/bin target/$NVHVC_PROFILE_DIR/nvhvc
      - install -Dm644 -t /app/share/applications packaging/io.github.Mahir007.NvhvcHdr10Tool.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps packaging/icons/io.github.Mahir007.NvhvcHdr10Tool.svg
      # CI writes the metainfo with metainfo.py, which needs the tags. A local build without it
      # gets one with no releases, and screenshots from main.
      - test -f packaging/flatpak/io.github.Mahir007.NvhvcHdr10Tool.metainfo.xml || sed
        -e 's|@RELEASES@|  <releases/>|' -e 's|@COMMIT@|main|'
        packaging/io.github.Mahir007.NvhvcHdr10Tool.metainfo.xml.in
        > packaging/flatpak/io.github.Mahir007.NvhvcHdr10Tool.metainfo.xml
      - install -Dm644 -t /app/share/metainfo packaging/flatpak/io.github.Mahir007.NvhvcHdr10Tool.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build-flatpak
          - scratch
          - target
