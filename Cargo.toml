[workspace]
resolver = "3"
members = ["crates/nvhvc-core", "crates/nvhvc-cli", "crates/nvhvc-gtk"]
# nvhvc-winui (Windows WinUI3 GUI) is its own workspace: it pulls the experimental
# windows-reactor git dependency, which we keep out of this workspace so non-Windows
# (e.g. the Linux GTK) builds never resolve/clone it.
exclude = ["crates/nvhvc-winui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
repository = "https://github.com/Mahir007/nvhvc_hdr10-tool"

[workspace.dependencies]
nvhvc-core = { path = "crates/nvhvc-core" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Tuned for small, fast release binaries (the project goal is efficiency).
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
