[workspace]
resolver = "3"
members = [
    "crates/nvhvc-core",
    "crates/nvhvc",
    "crates/nvhvc-gtk",
    "crates/nvhvc-winui",
    "xtask",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"
repository = "https://github.com/Mahir007/nvhvc_hdr10-tool"

[workspace.dependencies]
nvhvc-core = { path = "crates/nvhvc-core" }
nvhvc-winui = { path = "crates/nvhvc-winui" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# The fast profile, which CI uses for dev, alpha and beta versions and the tests: build time
# matters most, and the debug info makes backtraces work. It's Cargo's dev profile rather than a
# custom one, because windows-reactor-setup copies the runtime to the wrong folder for a custom
# profile.
[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

# Release candidates and releases: small, fast binaries, whatever the build time.
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
panic = "abort"
