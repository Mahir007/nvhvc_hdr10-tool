[package]
name = "nvhvc-winui"
version.workspace = true
edition.workspace = true
license.workspace = true
# windows-reactor 0.100 needs Rust 1.95.
rust-version = "1.95"
repository.workspace = true
description = "WinUI 3 (windows-reactor) GUI for the nvhvc HDR10 HEVC patcher (Windows)."

[dependencies]
nvhvc-core.workspace = true

# WinUI is Windows-only; on other platforms this crate builds a tiny stub so the workspace still
# compiles everywhere (mirrors nvhvc-gtk on Windows).
[target.'cfg(windows)'.dependencies]
windows-reactor = "0.100"
# Native file dialogs and the system accent colour. windows 0.62 carries its own windows-core;
# none of its types are passed to reactor.
windows = { version = "0.62", features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[build-dependencies]
windows-reactor-setup = "0.100"
