name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build, without the v
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APP_ID: io.github.Mahir007.NvhvcHdr10Tool
  RUST_VERSION: 1.100.0
  CARGO_TERM_COLOR: always
  # For nvhvc-gtk. Ubuntu 26.04 has GTK 4.22 and libadwaita 1.9.
  GTK_PACKAGES: libgtk-4-dev libadwaita-1-dev
  # Packs the binaries of a release build.
  UPX_VERSION: 5.3.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
      - name: ruff
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/astral-sh/ruff:0.17.6 check --no-cache .
      - name: Install packages
        run: |
          sudo apt-get update
          # GTK_PACKAGES is a list, so it's split on purpose.
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $GTK_PACKAGES desktop-file-utils appstream
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt \
            --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      # windows-reactor-setup downloads the Windows App SDK runtime for the Windows check.
      - name: Cache the Windows App SDK runtime
        uses: actions/cache@v6
        with:
          path: ~/.cache/windows-reactor-setup
          key: windows-reactor-setup-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy for Windows
        run: cargo clippy -p nvhvc -p nvhvc-winui --target x86_64-pc-windows-msvc --locked -- -D warnings
      - name: Desktop file and metainfo
        run: |
          desktop-file-validate "packaging/$APP_ID.desktop"
          python3 packaging/flatpak/metainfo.py 0.0.0-dev > "$RUNNER_TEMP/$APP_ID.metainfo.xml"
          appstreamcli validate --no-net --explain "$RUNNER_TEMP/$APP_ID.metainfo.xml"

  test:
    name: test-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            os: ubuntu-latest
          - system: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $GTK_PACKAGES
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Windows App SDK runtime
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\windows-reactor-setup
          key: windows-reactor-setup-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --workspace --locked

  # The command-line tool, statically linked against musl so it runs on any Linux. The build
  # runs on the target, so it checks the archive too.
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: .github/scripts/version.sh "$INPUT" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          NVHVC_VERSION: ${{ env.VERSION }}
        run: cargo build --profile "$PROFILE" --locked -p nvhvc --target x86_64-unknown-linux-musl
      - name: Cache UPX
        if: env.PROFILE == 'release'
        uses: actions/cache@v6
        with:
          path: ~/upx
          key: upx-${{ env.UPX_VERSION }}-linux
      - name: Install UPX
        if: env.PROFILE == 'release'
        run: |
          if [ ! -x ~/upx/upx ]; then
            curl -fsSL -o "$RUNNER_TEMP/upx.tar.xz" \
              "https://github.com/upx/upx/releases/download/v$UPX_VERSION/upx-$UPX_VERSION-amd64_linux.tar.xz"
            echo "79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1  $RUNNER_TEMP/upx.tar.xz" |
              sha256sum -c -
            mkdir -p ~/upx
            tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C ~/upx --strip-components=1
          fi
          echo "$HOME/upx" >> "$GITHUB_PATH"
      - name: Pack
        run: |
          name=nvhvc-$VERSION-linux-x86_64
          mkdir -p "stage/$name" dist
          cp "target/x86_64-unknown-linux-musl/$PROFILE_DIR/nvhvc" LICENSE README.md "stage/$name/"
          if [ "$PROFILE" = release ]; then upx -q --best --lzma "stage/$name/nvhvc"; fi
          tar -C stage --sort=name --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' \
            --mtime="@$SOURCE_DATE_EPOCH" --format=gnu -cf - "$name" | gzip -9n > "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          .github/scripts/summary.sh dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"
      - name: Check
        run: |
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE"/dist/* .
          sha256sum -c ./*.tar.gz.sha256
          tar -xzf ./*.tar.gz
          out=$("./nvhvc-$VERSION-linux-x86_64/nvhvc" --version)
          echo "$out"
          [ "$out" = "nvhvc $VERSION" ]
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The portable zip, with the Windows App SDK runtime beside nvhvc.exe, and the MSIX, which uses
  # the runtime installed on the system. The build runs on the target, so it checks both the way
  # a user installs them.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Version
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: .github/scripts/version.sh "$INPUT" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Windows App SDK runtime
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\windows-reactor-setup
          key: windows-reactor-setup-${{ hashFiles('Cargo.lock') }}
      - name: Build the portable apps
        env:
          NVHVC_VERSION: ${{ env.VERSION }}
        run: cargo build --profile $env:PROFILE --locked -p nvhvc
      # .cargo/config.toml links the C runtime statically. A RUSTFLAGS variable would replace it.
      - name: Check the exes don't need the Visual C++ runtime
        run: .github\scripts\check-crt.ps1 -Exe "target\$env:PROFILE_DIR\nvhvc.exe"
      - name: Cache UPX
        if: env.PROFILE == 'release'
        uses: actions/cache@v6
        with:
          path: ~\upx
          key: upx-${{ env.UPX_VERSION }}-windows
      - name: Install UPX
        if: env.PROFILE == 'release'
        run: |
          $dir = Join-Path $HOME upx
          if (-not (Test-Path "$dir\upx.exe")) {
            $zip = Join-Path $env:RUNNER_TEMP upx.zip
            Invoke-WebRequest "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip" `
              -OutFile $zip
            if ((Get-FileHash $zip).Hash -ne 'd127996c76615e431be810e9c8d2910dbe3dd400600c5c0c50276fc5a17a9705') {
              throw "upx-$env:UPX_VERSION-win64.zip doesn't match its SHA-256"
            }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            New-Item -ItemType Directory -Path $dir | Out-Null
            Copy-Item "$env:RUNNER_TEMP\upx-$env:UPX_VERSION-win64\upx.exe" $dir
          }
          $dir >> $env:GITHUB_PATH
      # The exe, the runtime files named in windows-runtime-files.txt, and the licence. A fast
      # build also has the exe's .pdb file, for backtraces. The log lists the files
      # windows-reactor-setup copied that the zip leaves out, to check after updating it.
      - name: Pack the zip
        run: |
          $name = "nvhvc-$env:VERSION-windows-x64"
          $bin = "target\$env:PROFILE_DIR"
          $stage = New-Item -ItemType Directory -Path "stage\$name"
          New-Item -ItemType Directory -Path dist | Out-Null
          $pdbs = @('nvhvc.pdb' | Where-Object { Test-Path -LiteralPath "$bin\$_" })
          $runtime = @(Get-Content .github\scripts\windows-runtime-files.txt |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          $files = @('nvhvc.exe') + $pdbs + $runtime
          foreach ($file in $files) {
            $to = Join-Path $stage $file
            New-Item -ItemType Directory -Force -Path (Split-Path $to) | Out-Null
            Copy-Item -LiteralPath (Join-Path $bin $file) -Destination $to
          }
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          $root = (Resolve-Path $bin).Path
          $kept = $files | ForEach-Object { $_.Replace('/', '\') }
          $left = Get-ChildItem $bin |
            Where-Object { $_.Name -notin 'build', 'deps', 'examples', 'incremental', '.fingerprint' } |
            Where-Object { $_.Name -notlike '.cargo*' } |
            ForEach-Object { if ($_.PSIsContainer) { Get-ChildItem $_.FullName -Recurse -File } else { $_ } } |
            ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
            Where-Object { $_ -notmatch '\.(d|rlib)$' -and $_ -notin $kept }
          "::group::$(@($left).Count) files from $bin left out of the zip"
          $left
          '::endgroup::'
          if ($env:PROFILE -eq 'release') {
            upx -q --best --lzma "$stage\nvhvc.exe"
            if ($LASTEXITCODE -ne 0) { throw "upx failed with exit code $LASTEXITCODE" }
          }
          .github\scripts\pack-zip.ps1 -Source $stage -Out "dist\$name.zip" -Epoch $env:SOURCE_DATE_EPOCH
      - name: Build the MSIX app
        env:
          NVHVC_VERSION: ${{ env.VERSION }}
          NVHVC_WINUI_RUNTIME: framework
        run: |
          cargo build --profile $env:PROFILE --locked -p nvhvc
          $bin = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP msix-bin)
          Get-ChildItem "target\$env:PROFILE_DIR\*" -Include nvhvc.exe, nvhvc.pdb |
            Copy-Item -Destination $bin
          if ($env:PROFILE -eq 'release') {
            upx -q --best --lzma "$bin\nvhvc.exe"
            if ($LASTEXITCODE -ne 0) { throw "upx failed with exit code $LASTEXITCODE" }
          }
      # Signed with the self-signed certificate in the secrets. A fork has no secrets, so its
      # MSIX is unsigned, but a release must be signed.
      - name: Pack the MSIX
        env:
          MSIX_PFX: ${{ secrets.MSIX_PFX }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
          RELEASE: ${{ inputs.version }}
        run: |
          $sign = @{}
          if ($env:MSIX_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP msix.pfx
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX))
            $sign = @{ Pfx = $pfx; Certificate = 'dist\nvhvc-msix.cer' }
          } elseif ($env:RELEASE) {
            throw 'A release needs the MSIX_PFX and MSIX_PFX_PASSWORD secrets'
          }
          $msix = packaging\msix\build-msix.ps1 -Version $env:VERSION -BinDir "$env:RUNNER_TEMP\msix-bin" `
            -Out "dist\nvhvc-$env:VERSION-windows-x64.msix" @sign
          if ($env:MSIX_PFX) { Remove-Item $pfx }
          "MSIX_VERSION=$msix" >> $env:GITHUB_ENV
      - name: Checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *.zip *.msix *.cer; do sha256sum "$f" > "$f.sha256"; done
          ../.github/scripts/summary.sh ./*.zip ./*.msix ./*.cer >> "$GITHUB_STEP_SUMMARY"
      - name: Check the zip
        run: |
          $dir = Join-Path $env:RUNNER_TEMP portable
          Push-Location dist
          $hash, $file = (Get-Content "nvhvc-$env:VERSION-windows-x64.zip.sha256") -split '\s+'
          if ((Get-FileHash $file).Hash -ne $hash) { throw "$file doesn't match its .sha256" }
          Expand-Archive $file -DestinationPath $dir
          Pop-Location
          $out = & "$dir\nvhvc.exe" --version
          if ($out -ne "nvhvc $env:VERSION") { throw "nvhvc.exe --version: $out" }
          .github\scripts\check-window.ps1 -Exe "$dir\nvhvc.exe"
      # The runner is an admin, which trusting the certificate needs. The runtime framework comes
      # from the Windows App SDK's own package, as winget's installer would put it there.
      - name: Check the MSIX
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP runtime
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.WindowsAppSDK.Runtime/2.4.0 `
            -OutFile "$runtime.zip"
          Expand-Archive "$runtime.zip" -DestinationPath $runtime
          Add-AppxPackage -Path "$runtime\tools\MSIX\win10-x64\Microsoft.WindowsAppRuntime.2.msix"
          $msix = "dist\nvhvc-$env:VERSION-windows-x64.msix"
          if (Test-Path dist\nvhvc-msix.cer) {
            Import-Certificate -FilePath dist\nvhvc-msix.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople |
              Out-Null
            $signature = Get-AuthenticodeSignature $msix
            if ($signature.Status -ne 'Valid') { throw "$msix's signature is $($signature.Status)" }
            Add-AppxPackage -Path $msix
          } else {
            Add-AppxPackage -Path $msix -AllowUnsigned
          }
          $package = Get-AppxPackage Mahir007.NvhvcHdr10Tool
          if ($package.Version -ne $env:MSIX_VERSION) { throw "installed $($package.Version), not $env:MSIX_VERSION" }
          $out = & "$env:LOCALAPPDATA\Microsoft\WindowsApps\nvhvc.exe" --version
          if ($out -ne "nvhvc $env:VERSION") { throw "nvhvc --version from the package: $out" }
          .github\scripts\check-window.ps1 -App "$($package.PackageFamilyName)!App"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.msix
            dist/*.cer
            dist/*.sha256
          retention-days: 1
          if-no-files-found: error

  # The Flatpak, built in the GNOME SDK the manifest names. The bundle is the same file for the
  # same commit: the build and the OSTree commit use the commit's time, and so does the bundle's
  # own timestamp, which fix-bundle-time.py sets.
  build-flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # bubblewrap, which flatpak-builder runs the build in, needs it.
      options: --privileged
    steps:
      # The metainfo's releases come from the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/version.sh "$INPUT" >> "$GITHUB_ENV"
      # actions/checkout makes the pushed tag lightweight, which loses the summary the metainfo
      # takes from its message.
      - name: Fetch the tags
        run: git fetch --force --tags origin
      - name: Install the Rust extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08
      # The bundled tools take about 20 minutes to build, so the cache keeps them, once for each
      # version of the manifest. A changed manifest starts from the newest cache, and
      # flatpak-builder rebuilds from the first module that changed.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-gnome-51-${{ hashFiles('packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-gnome-51-
      - name: Build
        run: |
          manifest=packaging/flatpak/$APP_ID.yml
          stamped=packaging/flatpak/stamped.yml
          # flatpak-builder leaves out .git, so the metainfo is made here.
          python3 packaging/flatpak/metainfo.py "$VERSION" > "packaging/flatpak/$APP_ID.metainfo.xml"
          sed -e "s/^\(        NVHVC_VERSION: \)0\.0\.0-dev$/\1$VERSION/" \
            -e "s/^\(        NVHVC_PROFILE: \)dev$/\1$PROFILE/" \
            -e "s/^\(        NVHVC_PROFILE_DIR: \)debug$/\1$PROFILE_DIR/" "$manifest" > "$stamped"
          grep -qx "        NVHVC_VERSION: $VERSION" "$stamped"
          grep -qx "        NVHVC_PROFILE: $PROFILE" "$stamped"
          grep -qx "        NVHVC_PROFILE_DIR: $PROFILE_DIR" "$stamped"
          flatpak-builder --disable-rofiles-fuse --ccache --force-clean --default-branch=stable \
            --override-source-date-epoch="$SOURCE_DATE_EPOCH" "$RUNNER_TEMP/build" "$stamped"
      # Any branch saves, not only main, so a branch that changes the manifest pays for the
      # rebuild once rather than on every push.
      - name: Save the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .flatpak-builder
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # appstreamcli compose drops a screenshot it can't download.
      - name: Check the screenshots
        run: |
          composed="$RUNNER_TEMP/build/files/share/app-info/xmls/$APP_ID.xml.gz"
          [ "$(zcat "$composed" | grep -c '<screenshot[ >]')" = \
            "$(grep -c '<screenshot[ >]' "packaging/$APP_ID.metainfo.xml.in")" ]
      - name: Bundle
        run: |
          bundle=nvhvc-$VERSION-x86_64.flatpak
          mkdir dist
          flatpak build-export --timestamp="@$SOURCE_DATE_EPOCH" --exclude='/lib/debug/*' \
            "$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" stable
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "dist/$bundle" "$APP_ID" stable
          python3 .github/scripts/fix-bundle-time.py "dist/$bundle"
          (cd dist && sha256sum "$bundle" > "$bundle.sha256")
          .github/scripts/summary.sh "dist/$bundle" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Installs the bundle on a stock system, the way a user would, so the GNOME runtime comes from
  # Flathub through the bundle's runtime repo.
  check-flatpak:
    needs: build-flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: .github/scripts/version.sh "$INPUT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: release-flatpak
          path: dist
      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends flatpak dbus-daemon
      - name: Check the bundle
        run: |
          cd dist
          sha256sum -c ./*.flatpak.sha256
          flatpak install --user -y --noninteractive ./*.flatpak
          # The runner has no session bus, and flatpak needs one for the app's D-Bus proxy.
          out=$(dbus-run-session -- flatpak run "$APP_ID" --version)
          echo "$out"
          [ "$out" = "nvhvc-gtk $VERSION" ]
          out=$(dbus-run-session -- flatpak run --command=nvhvc "$APP_ID" --version)
          echo "$out"
          [ "$out" = "nvhvc $VERSION" ]
          # Every tool the pipeline runs is in the bundle.
          tools=$(dbus-run-session -- flatpak run --command=nvhvc "$APP_ID" tools)
          echo "$tools"
          [ "$(grep -cE 'found \(PATH\) +/app/bin/' <<< "$tools")" = 5 ]
